on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master

name: macOS build

permissions:
    contents: read

jobs:
    test:
        uses: ./.github/workflows/test.yml
        with:
            os: macOS-latest
            # Expected to fail until PyQtAds publishes an arm64 macOS wheel: its
            # only macOS wheel is x86_64, so the arm64 runner falls back to the
            # sdist, which needs qmake. One version is enough to notice the day
            # that changes.
            python-versions: '["3.12"]'
