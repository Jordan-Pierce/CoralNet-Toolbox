on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master

name: Windows build
jobs:
    test-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"
              
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install uv
                  uv pip install --no-cache-dir Cython
                  uv pip install -r requirements.txt
                  uv pip install -e .
              env:
                  UV_SYSTEM_PYTHON: 1
            
            - name: Smoke test (imports the GUI tree, builds the main window)
              run: python tests/run_tests.py
              env:
                  UV_SYSTEM_PYTHON: 1
                  QT_QPA_PLATFORM: offscreen
