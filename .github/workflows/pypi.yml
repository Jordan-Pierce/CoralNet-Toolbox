# Actions below are pinned to full commit SHAs rather than tags such as @v4:
# a tag can be moved to point at different code, a commit cannot. See
# https://docs.github.com/en/actions/reference/security/secure-use
#
# The comment after each pin (e.g. # v4.4.0) names the release it came from.
# To see the exact code a pin runs, open
#   https://github.com/<owner>/<repo>/commit/<sha>
# e.g. actions/checkout@<sha> -> https://github.com/actions/checkout/commit/<sha>
# Dependabot (.github/dependabot.yml) opens a PR each month to update the pins.

# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: pypi

on:
    release:
        types: [created]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.x"
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install uv
                  uv pip install twine
              env:
                  UV_SYSTEM_PYTHON: 1
            - name: Build
              run: uv build
            # 1.1.0 published with no icons: setuptools_scm supplies the file
            # finder that collects the Icons/*.svg and Community/cfg/**/*.yaml,
            # and dropping it from pyproject's build requires was silent -- the
            # app renders blank icons rather than failing. Gate the upload on
            # the wheel actually carrying them.
            - name: Assert wheel carries package data
              run: |
                  want=$(git ls-files coralnet_toolbox | grep -cE '\.(svg|yaml|json)$')
                  got=$(unzip -l dist/*.whl | grep -cE '\.(svg|yaml|json)$')
                  echo "tracked: $want, in wheel: $got"
                  if [ "$want" -eq 0 ] || [ "$got" -ne "$want" ]; then
                      echo "::error::wheel carries $got of $want data files; check setuptools_scm in [build-system] requires"
                      exit 1
                  fi
            - name: Publish
              env:
                  TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
                  TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
              run: twine upload dist/*
