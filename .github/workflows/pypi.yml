# Actions below are pinned to full commit SHAs rather than tags such as @v4:
# a tag can be moved to point at different code, a commit cannot. See
# https://docs.github.com/en/actions/reference/security/secure-use
#
# The comment after each pin (e.g. # v4.4.0) names the release it came from.
# To see the exact code a pin runs, open
#   https://github.com/<owner>/<repo>/commit/<sha>
# e.g. actions/checkout@<sha> -> https://github.com/actions/checkout/commit/<sha>
# Dependabot (.github/dependabot.yml) opens a PR each month to update the pins.

# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: pypi

on:
    release:
        types: [created]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - name: Set up Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.x"
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install uv
                  uv pip install twine
              env:
                  UV_SYSTEM_PYTHON: 1
            - name: Build and publish
              env:
                  TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
                  TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
              run: |
                  uv build
                  twine upload dist/*
