name: docs-build
on:
    pull_request:
        branches:
            - main
            - master

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Qt runtime libraries
              # PyQt5 needs these even under the offscreen platform plugin; the GitHub
              # runner image does not ship them.
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      libgl1 libglib2.0-0 libegl1 libdbus-1-3 libfontconfig1 \
                      libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
                      libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
                      libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
                      libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
            - name: Install uv
              run: |
                  python -m pip install --upgrade pip
                  pip install uv

            - name: Install dependencies
              run: |
                  uv pip install --no-cache-dir Cython
                  uv pip install -r requirements.txt -r requirements_dev.txt
                  uv pip install .
              env:
                  UV_SYSTEM_PYTHON: 1
            - name: Discover typos with codespell
              run: codespell --skip="*.csv,*.geojson,*.json,*.js,*.html,*cff,*.pdf,./.git" --ignore-words-list="aci,acount,hist"
            - name: PKG-TEST
              run: python tests/run_tests.py
              env:
                  QT_QPA_PLATFORM: offscreen
            - name: Build docs
              run: |
                  mkdocs build
