# Actions below are pinned to full commit SHAs rather than tags such as @v4:
# a tag can be moved to point at different code, a commit cannot. See
# https://docs.github.com/en/actions/reference/security/secure-use
#
# The comment after each pin (e.g. # v4.4.0) names the release it came from.
# To see the exact code a pin runs, open
#   https://github.com/<owner>/<repo>/commit/<sha>
# e.g. actions/checkout@<sha> -> https://github.com/actions/checkout/commit/<sha>
# Dependabot (.github/dependabot.yml) opens a PR each month to update the pins.

name: docs-build
on:
    pull_request:
        branches:
            - main
            - master

permissions:
    contents: read

# Building the site needs only the docs tooling. The package itself, its tests
# and codespell run in ubuntu.yml.
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0 # git-revision-date plugins read the history
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.12"

            - name: Install docs tooling
              run: |
                  python -m pip install --upgrade pip uv
                  uv pip install -r requirements_dev.txt
              env:
                  UV_SYSTEM_PYTHON: 1

            - name: Build docs
              run: mkdocs build
