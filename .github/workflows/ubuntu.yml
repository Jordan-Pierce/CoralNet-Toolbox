on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master

name: Linux build
jobs:
    py-check:
        runs-on: ${{ matrix.config.os }}
        name: ${{ matrix.config.os }} (${{ matrix.config.py }})
        strategy:
            fail-fast: false
            matrix:
                config:
                    - { os: ubuntu-latest, py: "3.10" }
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.config.py }}
            - name: Install Qt runtime libraries
              # PyQt5 needs these even under the offscreen platform plugin; the GitHub
              # runner image does not ship them.
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      libgl1 libglib2.0-0 libegl1 libdbus-1-3 libfontconfig1 \
                      libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
                      libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
                      libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
                      libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
            - name: Install uv
              run: |
                  python -m pip install --upgrade pip
                  pip install uv
            - name: Install dependencies
              run: |
                  uv pip install -r requirements.txt
                  uv pip install -e .
              env:
                  UV_SYSTEM_PYTHON: 1
            - name: Smoke test (imports the GUI tree, builds the main window)
              run: python tests/run_tests.py
              env:
                  UV_SYSTEM_PYTHON: 1
                  QT_QPA_PLATFORM: offscreen
