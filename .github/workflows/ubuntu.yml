# Actions below are pinned to full commit SHAs rather than tags such as @v4:
# a tag can be moved to point at different code, a commit cannot. See
# https://docs.github.com/en/actions/reference/security/secure-use
#
# The comment after each pin (e.g. # v4.4.0) names the release it came from.
# To see the exact code a pin runs, open
#   https://github.com/<owner>/<repo>/commit/<sha>
# e.g. actions/checkout@<sha> -> https://github.com/actions/checkout/commit/<sha>
# Dependabot (.github/dependabot.yml) opens a PR each month to update the pins.

on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master

name: Linux build

permissions:
    contents: read

jobs:
    test:
        uses: ./.github/workflows/test.yml
        with:
            os: ubuntu-latest

    codespell:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.12"
            - name: Install codespell
              run: python -m pip install codespell
            - name: Discover typos with codespell
              run: codespell --skip="*.csv,*.geojson,*.json,*.js,*.html,*cff,*.pdf,./.git" --ignore-words-list="aci,acount,hist,lod,nd"
