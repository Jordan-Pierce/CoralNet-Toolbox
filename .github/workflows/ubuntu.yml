# Actions below are pinned to full commit SHAs rather than tags such as @v4:
# a tag can be moved to point at different code, a commit cannot. See
# https://docs.github.com/en/actions/reference/security/secure-use
#
# The comment after each pin (e.g. # v4.4.0) names the release it came from.
# To see the exact code a pin runs, open
#   https://github.com/<owner>/<repo>/commit/<sha>
# e.g. actions/checkout@<sha> -> https://github.com/actions/checkout/commit/<sha>
# Dependabot (.github/dependabot.yml) opens a PR each month to update the pins.

on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master

name: Linux build

permissions:
    contents: read

jobs:
    test:
        uses: ./.github/workflows/test.yml
        with:
            os: ubuntu-latest

    # Catches a missing-package-data regression on the PR rather than after a
    # release has already gone out, which is how 1.1.0 reached PyPI with no
    # icons. Cheap: the package is pure Python, so the build is seconds.
    package-data:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.12"
            - name: Install uv
              run: python -m pip install uv
            - name: Build wheel
              run: uv build --wheel
            - name: Assert wheel carries package data
              run: python scripts/check_wheel_data.py dist/*.whl

    codespell:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.12"
            - name: Install codespell
              run: python -m pip install codespell
            - name: Discover typos with codespell
              run: codespell --skip="*.csv,*.geojson,*.json,*.js,*.html,*cff,*.pdf,./.git" --ignore-words-list="aci,acount,hist,lod,nd"
