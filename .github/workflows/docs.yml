name: docs
on:
    push:
        branches:
            - main
            - master

permissions:
    contents: write # gh-deploy pushes the built site to gh-pages

# Building the site needs only the docs tooling. The package itself, its tests
# and codespell run in ubuntu.yml.
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0 # git-revision-date plugins read the history
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.12"

            - name: Install docs tooling
              run: |
                  python -m pip install --upgrade pip uv
                  uv pip install -r requirements_dev.txt
              env:
                  UV_SYSTEM_PYTHON: 1

            - run: mkdocs gh-deploy --force
