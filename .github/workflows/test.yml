# Actions below are pinned to full commit SHAs rather than tags such as @v4:
# a tag can be moved to point at different code, a commit cannot. See
# https://docs.github.com/en/actions/reference/security/secure-use
#
# The comment after each pin (e.g. # v4.4.0) names the release it came from.
# To see the exact code a pin runs, open
#   https://github.com/<owner>/<repo>/commit/<sha>
# e.g. actions/checkout@<sha> -> https://github.com/actions/checkout/commit/<sha>
# Dependabot (.github/dependabot.yml) opens a PR each month to update the pins.

# Reusable smoke-test job. ubuntu.yml, windows.yml and macos.yml call this with
# their runner; each keeps its own workflow file so the README badges stay
# per-platform.
name: test

on:
    workflow_call:
        inputs:
            os:
                description: Runner label
                required: true
                type: string
            python-versions:
                description: JSON list of Python versions to test
                required: false
                type: string
                default: '["3.10", "3.11", "3.12"]'

permissions:
    contents: read

jobs:
    smoke:
        name: ${{ inputs.os }} (${{ matrix.python-version }})
        runs-on: ${{ inputs.os }}
        strategy:
            fail-fast: false
            matrix:
                python-version: ${{ fromJSON(inputs.python-versions) }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install Qt runtime libraries
              if: runner.os == 'Linux'
              # PyQt5 needs these even under the offscreen platform plugin; the GitHub
              # runner image does not ship them.
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      libgl1 libglib2.0-0 libegl1 libdbus-1-3 libfontconfig1 \
                      libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
                      libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
                      libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
                      libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

            - name: Install uv
              run: python -m pip install --upgrade pip uv

            - name: Install CPU torch
              if: runner.os == 'Linux'
              # PyPI's Linux torch is the CUDA build, several GB of NVIDIA
              # libraries a GPU-less runner never uses. Installing torch first is
              # the README's own order, and the package install below keeps it.
              run: uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
              env:
                  UV_SYSTEM_PYTHON: 1

            - name: Install the package
              run: uv pip install -e .
              env:
                  UV_SYSTEM_PYTHON: 1

            - name: Smoke test (imports the GUI tree, builds the main window)
              run: python tests/run_tests.py
              env:
                  QT_QPA_PLATFORM: offscreen
